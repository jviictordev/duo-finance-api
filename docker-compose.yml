# Dependências para desenvolvimento local. Suba com: docker compose up -d
# A API roda no host (npm run start:dev) apontando para estes serviços.
# Anexos em dev vão pra disco local (storage/); em produção, Vercel Blob.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: duo
      POSTGRES_PASSWORD: duo
      POSTGRES_DB: duo_finance
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U duo -d duo_finance']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  pgdata:
